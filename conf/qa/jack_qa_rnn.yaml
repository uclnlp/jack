description: >
  Our optimized Jack QA reader which tries to keep up with SotA while being as resource friendly as possible.

parent_config: './conf/qa/modular_qa.yaml'

name: 'jack_qa_reader'

# fixed experiment seed
seed: 1337

# where to store the reader
reader_dir: './jack_qa_reader'

with_char_embeddings: True
repr_dim: 150
dropout: &dropout 0.2


# To be fast we have to restrict the use of RNNs as much as possible and use convolutions instead
model:
  encoder_layer:
  - input: 'question'
    module: 'lstm'
    with_projection: True
    activation: 'relu'
    residual: True

  - input: 'support'
    module: 'lstm'
    with_projection: True
    activation: 'relu'
    residual: True

  - input: 'support'
    dependent: 'question'
    module: 'attention_matching'
    attn_type: 'bilinear'
    with_sentinel: True  # we gate the attention with an additional scalar sentinel because what we retrieve might actually not be what we were looking for because (softmax) attn always retrieves something
    scaled: True

  - input: 'support'
    module: 'lstm'
    with_projection: True
    activation: 'relu'
    dropout: *dropout

  - input: 'support'
    output: 'support_1'
    module: 'self_attn'  # concatenates attention weighted state(s) with state at particular position
    attn_type: 'dot'
    scaled: True
    with_sentinel: True  # we gate the attention with an additional scalar sentinel because what we retrieve might actually not be what we were looking for because (softmax) attn always retrieves something
  - input: 'support'
    output: 'support_2'
    module: 'self_attn'  # concatenates attention weighted state(s) with state at particular position
    attn_type: 'bilinear'
    scaled: True
    with_sentinel: True  # we gate the attention with an additional scalar sentinel because what we retrieve might actually not be what we were looking for because (softmax) attn always retrieves something
    num_attn_heads: 2
  - input: ['support', 'support_1', 'support_2']
    output: 'support'
    module: 'concat'

  - input: ['support', 'word_in_question', 'word_in_question']  # 2x wiq because lstm impl likes even inputs
    output: 'support'
    module: 'concat'
  - input: 'support'
    module: 'lstm'  # the only application of a RNN
    with_projection: True
    activation: relu
  - input: 'support'
    module: 'conv'  # another residual convnet with receptive field of 3 to recognize
    activation: 'relu'
    conv_width: 3
    residual: True
    dropout: *dropout

  answer_layer:
    module: 'bilinear'
    max_span_size: 16
