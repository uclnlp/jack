description: >
  Our optimized Jack QA reader which tries to keep up with SotA while being as resource friendly as possible.

parent_config: './conf/modular_qa.yaml'

name: 'jack_qa_reader'

# fixed experiment seed
seed: 1337

# where to store the reader
reader_dir: './jack_qa_reader'

with_char_embeddings: True

repr_dim: &dim 150


# To be fast we have to restrict the use of RNNs as much as possible and use convolutions instead
model:
  question_layer:  # saving computation by running conv nets here
  - repr_dim: *dim
    layer_type: 'glu_conv'
    conv_width: 5
    num_layers: 2
    residual: True
  support_layer:
  - repr_dim: *dim
    layer_type: 'glu_conv'
    conv_width: 5
    num_layers: 2
    residual: True
  interaction_layer:  # saving computation by running mostly conv nets here
    layer_type: 'attention_matching'
    attn_type: 'diagonal_bilinear'
    scaled: True
  encoder_layer:
  - repr_dim: *dim
    layer_type: 'glu_conv'
    conv_width: 5
    num_layers: 1
    name: 'glu_conv_interaction_1'
  - repr_dim: *dim
    layer_type: 'self_attn'
    attn_type: 'diagonal_bilinear'
    scaled: True
  - repr_dim: *dim
    layer_type: 'lstm'
    with_projection: True
    num_layers: 1
  - repr_dim: *dim
    layer_type: 'glu_conv'
    conv_width: 5
    num_layers: 2
    name: 'glu_conv_interaction_2'
    residual: True
  answer_layer:
    layer_type: 'bilinear'
    max_span_size: 16
