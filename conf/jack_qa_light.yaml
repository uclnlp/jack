description: >
  Our optimized Jack QA reader which tries to keep up with SotA while being as resource friendly as possible. This
  model is a bit more lightweight than jack_qa.

parent_config: './conf/modular_qa.yaml'

name: 'jack_qa_reader'

# fixed experiment seed
seed: 1337

# where to store the reader
reader_dir: './jack_qa_reader'

with_char_embeddings: True
word_in_question_feature: True  # concatenated with output after interaction layer
repr_dim: 100

# To be fast we have to restrict the use of RNNs as much as possible and use convolutions instead
model:
  question_layer:  # saving computation by running conv nets here, receptive field is 10 tokens
  - layer_type: 'glu_conv'
    conv_width: 5
    num_layers: 2
    residual: True
  support_layer:   # saving computation by running conv nets here, receptive field is 10 tokens
  - layer_type: 'glu_conv'
    conv_width: 5
    num_layers: 2
    residual: True
  interaction_layer:  # saving computation by running mostly conv nets here
    layer_type: 'attention_matching'
    attn_type: 'diagonal_bilinear'
    scaled: True
  encoder_layer:
  - layer_type: 'glu_conv'
    conv_width: 5
    num_layers: 1
    name: 'glu_conv_interaction_1'
  - layer_type: 'self_attn'  # concatenates attention weighted state(s) with state at particular position
    attn_type: 'bilinear'
    num_attn_heads: 1
  - layer_type: 'lstm'  # the only application of a RNN
    with_projection: True
    num_layers: 1
  answer_layer:
    layer_type: 'bilinear'
    max_span_size: 16
